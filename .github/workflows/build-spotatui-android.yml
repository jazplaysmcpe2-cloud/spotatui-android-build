name: Build Spotatui Android Release APK

on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-spotatui-android.yml'
      - 'smoke-test-android.sh'
      - 'patches/**'
      - 'tools/**'
      - 'templates/**'

permissions:
  contents: write

concurrency:
  group: spotatui-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.check.outputs.source_sha }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Compare official source with the last smoke-tested revision
        id: check
        uses: actions/github-script@v8
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        with:
          script: |
            const upstreamResponse = await github.request('GET /repos/{owner}/{repo}/commits/{ref}', {
              owner: 'LargeModGames',
              repo: 'spotatui',
              ref: 'main',
            });
            const upstreamSha = upstreamResponse.data.sha;
            let previousSha = null;
            try {
              const marker = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'upstream-source-revision.txt',
                ref: context.ref_name,
              });
              if (!Array.isArray(marker.data) && marker.data.type === 'file') {
                previousSha = Buffer.from(marker.data.content, 'base64').toString('utf8').trim();
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            let hasUpdateableRelease = false;
            let releaseSourceSha = null;
            try {
              const response = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              hasUpdateableRelease = response.data.assets.some(
                asset => asset.name === 'spotatui-android-release.apk'
              );
              releaseSourceSha = response.data.body?.match(/Upstream source SHA:\s*([a-f0-9]{40})/i)?.[1] ?? null;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const scheduled = context.eventName === 'schedule';
            const keyConfigured = Boolean(process.env.ANDROID_KEYSTORE_BASE64);
            const needsFirstSignedRelease = keyConfigured &&
              (!hasUpdateableRelease || releaseSourceSha !== upstreamSha);
            const shouldBuild = !scheduled || previousSha !== upstreamSha || needsFirstSignedRelease;
            core.setOutput('source_sha', upstreamSha);
            core.setOutput('should_build', String(shouldBuild));
            await core.summary
              .addHeading('Spotatui upstream update check')
              .addTable([
                [{ data: 'Item', header: true }, { data: 'Value', header: true }],
                ['Official source SHA', upstreamSha],
                ['Last smoke-tested SHA', previousSha || 'not verified'],
                ['Signed Android release', hasUpdateableRelease ? 'available' : 'not published'],
                ['Build required', String(shouldBuild)],
              ])
              .write();
            if (!shouldBuild) core.info('No new upstream revision or release-signing change requires a scheduled rebuild.');
  build-android:
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Get official Spotatui source
        uses: actions/checkout@v7
        with:
          repository: LargeModGames/spotatui
          ref: ${{ needs.check-upstream.outputs.source_sha }}
          path: spotatui-source

      - name: Get build workflow scripts
        uses: actions/checkout@v7
        with:
          path: workflow-files
          persist-credentials: false

      - name: Patch and instrument native Android loopback connection
        run: python3 workflow-files/patches/patch_android_loopback_diagnostics.py "$GITHUB_WORKSPACE/spotatui-source"

      - name: Install native Stats screen and tab
        run: |
          set -euo pipefail
          python3 workflow-files/patches/patch_android_stats.py "$GITHUB_WORKSPACE/spotatui-source" "$GITHUB_WORKSPACE/workflow-files/templates/mobile-stats.tsx"

      - name: Add Android release update checker to Settings
        run: python3 workflow-files/tools/patch_android_updates.py "$GITHUB_WORKSPACE/spotatui-source"

      - name: Record exact source revision
        working-directory: spotatui-source
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/spotatui-source-commit.txt"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: spotatui-source/mobile/app/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK, emulator, and NDK
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "emulator" \
            "system-images;android-36;google_apis;x86_64" \
            "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Set up Rust for phone and emulator architectures
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build optimized native Android core
        working-directory: spotatui-source/mobile/core
        run: |
          set -euo pipefail
          cargo ndk -t arm64-v8a -t x86_64 -P 26 \
            -o ../app/modules/spotatui-core/android/src/main/jniLibs \
            build --release

      - name: Install app dependencies
        working-directory: spotatui-source/mobile/app
        run: npm ci

      - name: Configure Android version and architectures
        working-directory: spotatui-source/mobile/app
        env:
          ANDROID_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          path = Path("app.json")
          config = json.loads(path.read_text())
          expo = config.setdefault("expo", {})
          android = expo.setdefault("android", {})
          core_version = tomllib.loads(Path("../../Cargo.toml").read_text())["package"]["version"]
          build_number = int(os.environ["ANDROID_BUILD_NUMBER"])
          version_name = f"{core_version}-android.{build_number}"
          expo["version"] = version_name
          android["versionCode"] = build_number
          android["usesCleartextTraffic"] = True

          found_build_properties = False
          for plugin in expo.get("plugins", []):
              if (isinstance(plugin, list) and len(plugin) > 1
                      and plugin[0] == "expo-build-properties"
                      and isinstance(plugin[1], dict)):
                  plugin[1].setdefault("android", {})["buildArchs"] = ["arm64-v8a", "x86_64"]
                  found_build_properties = True

          if not found_build_properties:
              raise SystemExit("Expected expo-build-properties plugin was not found; refusing an unverified config.")

          path.write_text(json.dumps(config, indent=2) + "\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"ANDROID_VERSION_NAME={version_name}\n")
          print(f"Configured Android version {version_name}, versionCode {build_number}, ABIs arm64-v8a/x86_64.")
          PY

      - name: Align mobile home helpers with current GUI exports
        working-directory: spotatui-source/mobile/app
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path

          home = Path("src/app/(tabs)/index.tsx")
          source = home.read_text()
          old = "import { asksDiscover, greeting, madeForYou, recentAlbums, SHELF_MAX } from '@gui/pagesModel';"
          new = "import { asksDiscover } from '@gui/pagesModel';\nimport { greeting, madeForYou, recentAlbums, SHELF_MAX } from '@/mobilePagesModel';"

          if source.count(old) != 1:
              raise SystemExit("Expected mobile home helper import was not found exactly once; refusing a blind patch.")

          home.write_text(source.replace(old, new, 1))
          PYCODE

          cat > src/mobilePagesModel.ts <<'TS'
          import type { DiscoverPayload } from '@gui/bindings/DiscoverPayload';
          import type { DiscoverPlaylist } from '@gui/bindings/DiscoverPlaylist';
          import type { TrackInfo } from '@gui/bindings/TrackInfo';

          /** Maximum number of cards shown in each horizontally scrolling home shelf. */
          export const SHELF_MAX = 10;

          /** A time-of-day greeting, kept local to the mobile Home screen. */
          export function greeting(hour: number): string {
            if (hour < 12) return 'Good morning';
            if (hour < 18) return 'Good afternoon';
            return 'Good evening';
          }

          /** Flatten Made For You shelves while preserving server-provided order. */
          export function madeForYou(discover: DiscoverPayload | null): DiscoverPlaylist[] {
            return (discover?.shelves ?? []).flatMap((shelf) => shelf.playlists);
          }

          /** Recent album cards: the first track per album wins, most recent first. */
          export function recentAlbums(tracks: TrackInfo[]): TrackInfo[] {
            const seen = new Set<string>();
            return tracks.filter((track) => {
              const albumId = track.album_id;
              if (!albumId || seen.has(albumId)) return false;
              seen.add(albumId);
              return true;
            });
          }
          TS

      - name: Prevent an indefinite font-loading splash
        working-directory: spotatui-source/mobile/app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/app/_layout.tsx")
          source = path.read_text()

          old = """export default function RootLayout() {
            const [fontsLoaded] = useFonts(fontFiles);
          """
          new = """export default function RootLayout() {
            const [fontsLoaded, fontError] = useFonts(fontFiles);
            const [fontLoadTimedOut, setFontLoadTimedOut] = useState(false);
          """

          if source.count(old) != 1:
              raise SystemExit("RootLayout font declaration changed upstream; refusing a blind patch.")

          source = source.replace(old, new, 1)

          old = """  useEffect(() => {
              if (fontsLoaded) SplashScreen.hideAsync();
            }, [fontsLoaded]);
            if (!fontsLoaded) return null;
          """
          new = """  useEffect(() => {
              const timeout = setTimeout(() => setFontLoadTimedOut(true), 8000);
              return () => clearTimeout(timeout);
            }, []);
            const canRender = fontsLoaded || Boolean(fontError) || fontLoadTimedOut;
            useEffect(() => {
              if (canRender) {
                void SplashScreen.hideAsync().catch(() => undefined);
              }
            }, [canRender]);
            useEffect(() => {
              if (fontError) console.warn('[Spotatui] Font loading failed; using system fallback.', fontError);
              if (fontLoadTimedOut && !fontsLoaded && !fontError) {
                console.warn('[Spotatui] Font loading timed out; using system fallback.');
              }
            }, [fontError, fontLoadTimedOut, fontsLoaded]);
            if (!canRender) return null;
          """

          if source.count(old) != 1:
              raise SystemExit("RootLayout splash logic changed upstream; refusing a blind patch.")

          source = source.replace(old, new, 1)
          path.write_text(source)
          PY

      - name: Lint and type-check mobile app
        working-directory: spotatui-source/mobile/app
        run: |
          set -euo pipefail
          npx expo lint
          npx tsc --noEmit

      - name: Generate Android project
        working-directory: spotatui-source/mobile/app
        run: npx expo prebuild --platform android --no-install

      - name: Allow cleartext only for the local Rust core
        working-directory: spotatui-source/mobile/app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          start = source.find("<application")
          end = source.find(">", start)
          if start < 0 or end < 0:
              raise SystemExit("Could not identify the generated Android application manifest element.")
          tag = source[start:end]
          def set_attribute(tag, name, value):
              pattern = r'\s+' + re.escape(name) + r'="[^"]*"'
              if re.search(pattern, tag):
                  return re.sub(pattern, ' ' + name + '="' + value + '"', tag, count=1)
              return tag + ' ' + name + '="' + value + '"'
          tag = set_attribute(tag, "android:networkSecurityConfig", "@xml/network_security_config")
          tag = set_attribute(tag, "android:usesCleartextTraffic", "true")
          source = source[:start] + tag + source[end:]
          manifest.write_text(source)

          xml_dir = Path("android/app/src/main/res/xml")
          xml_dir.mkdir(parents=True, exist_ok=True)
          network_config = xml_dir / "network_security_config.xml"
          network_config.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <domain-config cleartextTrafficPermitted="true">
              <domain includeSubdomains="false">127.0.0.1</domain>
              <domain includeSubdomains="false">localhost</domain>
            </domain-config>
          </network-security-config>
          """)
          ET.parse(manifest)
          ET.parse(network_config)
          if source.count("android:networkSecurityConfig=") != 1:
              raise SystemExit("Expected exactly one network security config reference.")
          print("Installed and validated a loopback-only cleartext network security policy.")
          PY

      - name: Build standalone release APK
        working-directory: spotatui-source/mobile/app/android
        run: ./gradlew --no-daemon --stacktrace clean :app:assembleRelease

      - name: Configure persistent Android release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          values=("$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD")
          present=0
          for value in "${values[@]}"; do
            [[ -n "$value" ]] && present=$((present + 1))
          done
          if [[ "$present" -eq 0 ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No persistent Android signing secrets are configured. This build is for CI smoke testing only; no public update release will be published."
            exit 0
          fi
          if [[ "$present" -ne 4 ]]; then
            echo "::error::Android signing secrets are incomplete. Configure all four ANDROID_KEYSTORE_* / ANDROID_KEY_* secrets."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/spotatui-android-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "available=true" >> "$GITHUB_OUTPUT"
          APK="spotatui-source/mobile/app/android/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$RUNNER_TEMP/spotatui-android-release-signed.apk" "$APK"
          mv "$RUNNER_TEMP/spotatui-android-release-signed.apk" "$APK"
          echo "Android APK signed with the persistent release key."

      - name: Verify APK signature, embedded JavaScript, SDK, and native ABIs
        working-directory: spotatui-source/mobile/app/android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -q "package: name='com.largemodgames.spotatui'" "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -q "sdkVersion:'26'" "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -q "versionCode='${{ github.run_number }}'" "$GITHUB_WORKSPACE/apk-badging.txt"
          unzip -Z1 "$APK" | grep -Fxq 'assets/index.android.bundle'
          unzip -Z1 "$APK" | grep -Fxq 'lib/arm64-v8a/libspotatui_mobile.so'
          unzip -Z1 "$APK" | grep -Fxq 'lib/x86_64/libspotatui_mobile.so'
          unzip -p "$APK" assets/index.android.bundle > "$GITHUB_WORKSPACE/index.android.bundle"
          test "$(wc -c < "$GITHUB_WORKSPACE/index.android.bundle")" -gt 100000
          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/SHA256SUMS.txt"
          cp "$APK" "$GITHUB_WORKSPACE/spotatui-android-release.apk"

      - name: Validate Android smoke-test script
        run: bash -n workflow-files/smoke-test-android.sh

      - name: Enable and verify KVM for Android emulator
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::This runner does not expose /dev/kvm; hardware-accelerated Android emulator testing is unavailable."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check

      - name: Smoke-test standalone APK in Android emulator (two cold starts)
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          disable-linux-hw-accel: false
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/workflow-files/smoke-test-android.sh"

      - name: Upload tested Android APK artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: spotatui-android-${{ steps.signing.outputs.available == 'true' && 'release' || 'ci-test' }}-apk
          path: |
            spotatui-android-release.apk
            SHA256SUMS.txt
            spotatui-source-commit.txt
            apk-badging.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish signed Android update release
        if: success() && steps.signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/android-release-notes.md" <<EOF
          Spotatui Android version $ANDROID_VERSION_NAME

          - Android build number: $GITHUB_RUN_NUMBER
          - Upstream source SHA: $(cat "$GITHUB_WORKSPACE/spotatui-source-commit.txt")
          - Android port SHA: $GITHUB_SHA
          - Supported ABIs: arm64-v8a and x86_64

          This APK is built from the official Spotatui mobile source with Android-specific compatibility patches. SHA-256 is published in SHA256SUMS.txt.
          EOF
          gh release create "android-build-$GITHUB_RUN_NUMBER" \
            "$GITHUB_WORKSPACE/spotatui-android-release.apk" \
            "$GITHUB_WORKSPACE/SHA256SUMS.txt" \
            "$GITHUB_WORKSPACE/spotatui-source-commit.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Spotatui Android $ANDROID_VERSION_NAME" \
            --notes-file "$GITHUB_WORKSPACE/android-release-notes.md"

      - name: Record successfully smoke-tested upstream revision
        if: success()
        uses: actions/github-script@v8
        env:
          SOURCE_SHA: ${{ needs.check-upstream.outputs.source_sha }}
        with:
          script: |
            const path = 'upstream-source-revision.txt';
            const next = process.env.SOURCE_SHA + '\n';
            let existing = null;
            let sha = null;
            try {
              const response = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: context.ref_name,
              });
              if (!Array.isArray(response.data) && response.data.type === 'file') {
                existing = Buffer.from(response.data.content, 'base64').toString('utf8');
                sha = response.data.sha;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existing === next) {
              core.info('The last smoke-tested source revision is already recorded.');
            } else {
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                message: 'ci: record smoke-tested upstream Spotatui revision',
                content: Buffer.from(next).toString('base64'),
                sha: sha || undefined,
                branch: context.ref_name,
              });
              core.info('Recorded smoke-tested upstream revision ' + process.env.SOURCE_SHA);
            }

      - name: Upload diagnostic logs if smoke test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: spotatui-android-smoke-test-diagnostics
          path: |
            spotatui-logcat-round-*.txt
            spotatui-ui-round-*.xml
            spotatui-screen-round-*.png
            spotatui-activity-round-*.txt
            spotatui-adb-devices-failure.txt
            apk-badging.txt
            SHA256SUMS.txt
          if-no-files-found: ignore
          retention-days: 7