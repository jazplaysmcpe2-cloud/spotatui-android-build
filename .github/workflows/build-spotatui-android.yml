name: Build Spotatui Android Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-spotatui-android.yml'
      - 'smoke-test-android.sh'
      - 'patches/**'

permissions:
  contents: read

concurrency:
  group: spotatui-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Get official Spotatui source
        uses: actions/checkout@v7
        with:
          repository: LargeModGames/spotatui
          ref: c44f106faa49642832ba224ee01b760cb2351f52
          path: spotatui-source

      - name: Get build workflow scripts
        uses: actions/checkout@v7
        with:
          path: workflow-files
          persist-credentials: false

      - name: Record exact source revision
        working-directory: spotatui-source
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/spotatui-source-commit.txt"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: spotatui-source/mobile/app/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK, emulator, and NDK
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "emulator" \
            "system-images;android-36;google_apis;x86_64" \
            "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Set up Rust for phone and emulator architectures
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build optimized native Android core
        working-directory: spotatui-source/mobile/core
        run: |
          set -euo pipefail
          cargo ndk -t arm64-v8a -t x86_64 -P 26 \
            -o ../app/modules/spotatui-core/android/src/main/jniLibs \
            build --release

      - name: Install app dependencies
        working-directory: spotatui-source/mobile/app
        run: npm ci

      - name: Configure Android architectures and cleartext loopback
        working-directory: spotatui-source/mobile/app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("app.json")
          config = json.loads(path.read_text())
          expo = config.setdefault("expo", {})
          android = expo.setdefault("android", {})
          android["usesCleartextTraffic"] = True

          found_build_properties = False
          for plugin in expo.get("plugins", []):
              if (isinstance(plugin, list) and len(plugin) > 1
                      and plugin[0] == "expo-build-properties"
                      and isinstance(plugin[1], dict)):
                  plugin[1].setdefault("android", {})["buildArchs"] = ["arm64-v8a", "x86_64"]
                  found_build_properties = True

          if not found_build_properties:
              raise SystemExit("Expected expo-build-properties plugin was not found; refusing an unverified config.")

          path.write_text(json.dumps(config, indent=2) + "\n")
          PY

      - name: Align mobile home helpers with current GUI exports
        working-directory: spotatui-source/mobile/app
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path

          home = Path("src/app/(tabs)/index.tsx")
          source = home.read_text()
          old = "import { asksDiscover, greeting, madeForYou, recentAlbums, SHELF_MAX } from '@gui/pagesModel';"
          new = "import { asksDiscover } from '@gui/pagesModel';\nimport { greeting, madeForYou, recentAlbums, SHELF_MAX } from '@/mobilePagesModel';"

          if source.count(old) != 1:
              raise SystemExit("Expected mobile home helper import was not found exactly once; refusing a blind patch.")

          home.write_text(source.replace(old, new, 1))
          PYCODE

          cat > src/mobilePagesModel.ts <<'TS'
          import type { DiscoverPayload } from '@gui/bindings/DiscoverPayload';
          import type { DiscoverPlaylist } from '@gui/bindings/DiscoverPlaylist';
          import type { TrackInfo } from '@gui/bindings/TrackInfo';

          /** Maximum number of cards shown in each horizontally scrolling home shelf. */
          export const SHELF_MAX = 10;

          /** A time-of-day greeting, kept local to the mobile Home screen. */
          export function greeting(hour: number): string {
            if (hour < 12) return 'Good morning';
            if (hour < 18) return 'Good afternoon';
            return 'Good evening';
          }

          /** Flatten Made For You shelves while preserving server-provided order. */
          export function madeForYou(discover: DiscoverPayload | null): DiscoverPlaylist[] {
            return (discover?.shelves ?? []).flatMap((shelf) => shelf.playlists);
          }

          /** Recent album cards: the first track per album wins, most recent first. */
          export function recentAlbums(tracks: TrackInfo[]): TrackInfo[] {
            const seen = new Set<string>();
            return tracks.filter((track) => {
              const albumId = track.album_id;
              if (!albumId || seen.has(albumId)) return false;
              seen.add(albumId);
              return true;
            });
          }
          TS

      - name: Prevent an indefinite font-loading splash
        working-directory: spotatui-source/mobile/app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/app/_layout.tsx")
          source = path.read_text()

          old = """export default function RootLayout() {
            const [fontsLoaded] = useFonts(fontFiles);
          """
          new = """export default function RootLayout() {
            const [fontsLoaded, fontError] = useFonts(fontFiles);
            const [fontLoadTimedOut, setFontLoadTimedOut] = useState(false);
          """

          if source.count(old) != 1:
              raise SystemExit("RootLayout font declaration changed upstream; refusing a blind patch.")

          source = source.replace(old, new, 1)

          old = """  useEffect(() => {
              if (fontsLoaded) SplashScreen.hideAsync();
            }, [fontsLoaded]);
            if (!fontsLoaded) return null;
          """
          new = """  useEffect(() => {
              const timeout = setTimeout(() => setFontLoadTimedOut(true), 8000);
              return () => clearTimeout(timeout);
            }, []);
            const canRender = fontsLoaded || Boolean(fontError) || fontLoadTimedOut;
            useEffect(() => {
              if (canRender) {
                void SplashScreen.hideAsync().catch(() => undefined);
              }
            }, [canRender]);
            useEffect(() => {
              if (fontError) console.warn('[Spotatui] Font loading failed; using system fallback.', fontError);
              if (fontLoadTimedOut && !fontsLoaded && !fontError) {
                console.warn('[Spotatui] Font loading timed out; using system fallback.');
              }
            }, [fontError, fontLoadTimedOut, fontsLoaded]);
            if (!canRender) return null;
          """

          if source.count(old) != 1:
              raise SystemExit("RootLayout splash logic changed upstream; refusing a blind patch.")

          source = source.replace(old, new, 1)
          path.write_text(source)
          PY

      - name: Lint and type-check mobile app
        working-directory: spotatui-source/mobile/app
        run: |
          set -euo pipefail
          npx expo lint
          npx tsc --noEmit

      - name: Generate Android project
        working-directory: spotatui-source/mobile/app
        run: npx expo prebuild --platform android --no-install

      - name: Build standalone release APK
        working-directory: spotatui-source/mobile/app/android
        run: ./gradlew --no-daemon --stacktrace clean :app:assembleRelease

      - name: Verify APK signature, embedded JavaScript, SDK, and native ABIs
        working-directory: spotatui-source/mobile/app/android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -q "package: name='com.largemodgames.spotatui'" "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -q "sdkVersion:'26'" "$GITHUB_WORKSPACE/apk-badging.txt"
          unzip -Z1 "$APK" | grep -Fxq 'assets/index.android.bundle'
          unzip -Z1 "$APK" | grep -Fxq 'lib/arm64-v8a/libspotatui_mobile.so'
          unzip -Z1 "$APK" | grep -Fxq 'lib/x86_64/libspotatui_mobile.so'
          unzip -p "$APK" assets/index.android.bundle > "$GITHUB_WORKSPACE/index.android.bundle"
          test "$(wc -c < "$GITHUB_WORKSPACE/index.android.bundle")" -gt 100000
          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/SHA256SUMS.txt"
          cp "$APK" "$GITHUB_WORKSPACE/spotatui-android-release.apk"

      - name: Upload release APK and checksum
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: spotatui-android-release-apk
          path: |
            spotatui-android-release.apk
            SHA256SUMS.txt
            spotatui-source-commit.txt
            apk-badging.txt
          if-no-files-found: error
          retention-days: 14

      - name: Validate Android smoke-test script
        run: bash -n workflow-files/smoke-test-android.sh

      - name: Enable and verify KVM for Android emulator
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::This runner does not expose /dev/kvm; hardware-accelerated Android emulator testing is unavailable."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check

      - name: Smoke-test standalone APK in Android emulator (two cold starts)
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          disable-linux-hw-accel: false
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/workflow-files/smoke-test-android.sh"

      - name: Upload diagnostic logs if smoke test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: spotatui-android-smoke-test-diagnostics
          path: |
            spotatui-logcat-round-*.txt
            spotatui-ui-round-*.xml
            spotatui-screen-round-*.png
            spotatui-activity-round-*.txt
            spotatui-adb-devices-failure.txt
            apk-badging.txt
            SHA256SUMS.txt
          if-no-files-found: ignore
          retention-days: 7